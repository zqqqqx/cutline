name: Idea or wish
description: A function you are missing or something that could be easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: Describe the video or the step you are working on, not only the function. That makes it easier to find a good solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Cutline or elsewhere. Leave empty if you can't do it at all.
