[package]
name = "cl-app"
description = "Cutline: Desktop-App (egui auf wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cutline"
path = "src/main.rs"

[dependencies]
cl-core.workspace = true
cl-media.workspace = true
cl-fonts.workspace = true
cl-i18n.workspace = true
cl-epidemic.workspace = true
cl-import.workspace = true
cl-plugin.workspace = true
cl-mcp.workspace = true
cl-export.workspace = true
cl-fx.workspace = true
cl-update.workspace = true
cl-analyze.workspace = true
serde.workspace = true
tempfile.workspace = true
serde_json.workspace = true
anyhow.workspace = true
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
rfd = "0.15"
raw-window-handle = "0.6"
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
cpal = "0.15"
hound = "3.5"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
winresource = "0.1"
