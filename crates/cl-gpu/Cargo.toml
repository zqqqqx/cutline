[package]
name = "cl-gpu"
description = "Cutline: transitions as WGSL shaders (headless via wgpu), same function for preview and export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# exactly the versions eframe already brings (Cargo.lock); backends as there
wgpu = { version = "24.0.5", default-features = false, features = ["wgsl"] }
naga = { version = "24.0.0", features = ["wgsl-in"] }
pollster = "0.4"

[dev-dependencies]
cl-plugin.workspace = true
cl-fx.workspace = true
