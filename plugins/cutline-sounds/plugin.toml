# Sounds for creators: generated with FFmpeg (recipes in RECIPES.md), public domain (CC0).
[plugin]
id = "cutline.sounds"
version = "0.1.0"
api = 1
kind = "asset-pack"
name = { de = "Sounds für Creator", en = "Sounds for creators" }
description = { de = "Whoosh, Riser, Impacts, Jingles, Tippen, Glocken und mehr – selbst erzeugt", en = "Whooshes, risers, impacts, jingles, typing, bells and more – generated in-house" }
authors = ["Cutline project"]
license = "CC0-1.0"
source = "https://github.com/zqqqqx/cutline"

