# Bundled base package: reference for the asset package format (docs/ARCHITECTURE.md).
[plugin]
id = "cutline.basis"
version = "0.1.0"
api = 1
kind = "asset-pack"
name = { de = "Basis-Effekte", en = "Basic effects" }
description = { de = "Grundausstattung an Effekten und Filtern", en = "Essential effects and filters" }
authors = ["Cutline project"]
license = "CC0-1.0"

[[asset]]
id = "soft-glow"
kind = "video-effect"
name = { de = "Sanftes Leuchten", en = "Soft glow" }
category = ["Light"]
ffmpeg = "gblur=sigma={radius},eq=brightness=0.04*{intensity}:saturation=1.1"
params = [{ type = "float", id = "radius", min = 0.5, max = 10.0, default = 2.5 }]

[[asset]]
id = "lomo"
kind = "filter"
name = { de = "Lomo", en = "Lomo" }
category = ["Film"]
ffmpeg = "curves=preset=increase_contrast,vignette=angle=0.7,eq=saturation=1.25"
