]
license = "MIT"
author = "rectalogic"
source = "https://github.com/gl-transitions/gl-transitions/blob/master/transitions/CrossZoom.glsl"

[[asset]]
id = "cube"
kind = "transition"
name = { de = "Würfel", en = "Cube" }
