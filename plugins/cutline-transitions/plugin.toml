# Shader transitions (WGSL, rendered with cl-gpu). Without a GPU the fallback transition (`fallback`) runs.
# Own transitions: CC0-1.0 (Cutline project). Ported GL Transitions: MIT, author and source per transition,
# license text in LICENSE-gl-transitions.txt.
[plugin]
id = "cutline.transitions"
version = "1.0.0"
api = 1
kind = "asset-pack"
name = { de = "Übergänge", en = "Transitions" }
description = { de = "Shader-Übergänge: Reißschwenk, Zoom-Stoß, Würfel, Glitch, Licht und mehr", en = "Shader transitions: whip pans, zoom punches, cube, glitch, light and more" }
authors = ["Cutline project"]
license = "CC0-1.0"

[[asset]]
id = "whip-pan-left"
kind = "transition"
name = { de = "Reißschwenk links", en = "Whip pan left" }
category = ["Blur"]
shader = "shaders/whip_pan.wgsl"
fallback = "slideleft"
params = [
  { type = "float", id = "dx", min = -1.0, max = 1.0, default = -1.0 },
  { type = "float", id = "dy", min = -1.0, max = 1.0, default = 0.0 },
]

[[asset]]
id = "whip-pan-right"
kind = "transition"
name = { de = "Reißschwenk rechts", en = "Whip pan right" }
category = ["Blur"]
shader = "shaders/whip_pan.wgsl"
fallback = "slideright"
params = [
  { type = "float", id = "dx", min = -1.0, max = 1.0, default = 1.0 },
  { type = "float", id = "dy", min = -1.0, max = 1.0, default = 0.0 },
]

[[asset]]
id = "whip-pan-up"
kind = "transition"
name = { de = "Reißschwenk hoch", en = "Whip pan up" }
category = ["Blur"]
shader = "shaders/whip_pan.wgsl"
fallback = "slideup"
params = [
  { type = "float", id = "dx", min = -1.0, max = 1.0, default = 0.0 },
  { type = "float", id = "dy", min = -1.0, max = 1.0, default = 1.0 },
]

[[asset]]
id = "whip-pan-down"
kind = "transition"
name = { de = "Reißschwenk runter", en = "Whip pan down" }
category = ["Blur"]
shader = "shaders/whip_pan.wgsl"
fallback = "slidedown"
params = [
  { type = "float", id = "dx", min = -1.0, max = 1.0, default = 0.0 },
  { type = "float", id = "dy", min = -1.0, max = 1.0, default = -1.0 },
]

[[asset]]
id = "zoom-punch-in"
kind = "transition"
name = { de = "Zoom-Stoß hinein", en = "Zoom punch in" }
category = ["Blur"]
shader = "shaders/zoom_punch.wgsl"
fallback = "zoomin"
params = [
  { type = "float", id = "direction", min = -1.0, max = 1.0, default = 1.0 },
  { type = "float", id = "blur", min = 0.0, max = 1.0, default = 0.35 },
  { type = "float", id = "zoom", min = 1.5, max = 6.0, default = 3.0 },
]

[[asset]]
id = "zoom-punch-out"
kind = "transition"
name = { de = "Zoom-Stoß heraus", en = "Zoom punch out" }
category = ["Blur"]
shader = "shaders/zoom_punch.wgsl"
fallback = "fade"
params = [
  { type = "float", id = "direction", min = -1.0, max = 1.0, default = -1.0 },
  { type = "float", id = "blur", min = 0.0, max = 1.0, default = 0.35 },
  { type = "float", id = "zoom", min = 1.5, max = 6.0, default = 3.0 },
]

[[asset]]
id = "spin-blur"
kind = "transition"
name = { de = "Dreh-Unschärfe", en = "Spin blur" }
category = ["Blur"]
shader = "shaders/spin_blur.wgsl"
fallback = "radial"
params = [
  { type = "float", id = "blur", min = 0.0, max = 2.0, default = 0.9 },
]

[[asset]]
id = "zoom-blur"
