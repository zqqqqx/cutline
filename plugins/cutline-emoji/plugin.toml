# Emoji for reactions: Microsoft Fluent Emoji (MIT), static. Selection and names: Cutline project.
[plugin]
id = "cutline.emoji"
version = "0.1.0"
api = 1
kind = "asset-pack"
name = { de = "Emoji", en = "Emoji" }
description = { de = "Fluent Emoji für Reaktionen: Gesichter, Hände, Herzen, Symbole, Tiere und Essen", en = "Fluent emoji for reactions: faces, hands, hearts, symbols, animals and food" }
authors = ["Microsoft Corporation"]
license = "MIT"
source = "https://github.com/microsoft/fluentui-emoji"

